<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#21183f" />
    <meta name="description" content="Color Clash — a colorful match-3 adventure with levels, artifacts and powerful boosters." />
    <title>Color Clash</title>
    <link rel="icon" href="logo.png" />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="logic.js" defer></script>
  </head>
  <body>
    <div class="ambient" aria-hidden="true">
      <span class="orb orb-one"></span><span class="orb orb-two"></span><span class="orb orb-three"></span>
      <span class="spark s1">✦</span><span class="spark s2">✧</span><span class="spark s3">✦</span>
    </div>

    <div id="app" class="app-shell">
      <header class="topbar glass">
        <button id="homeButton" class="brand" aria-label="Color Clash home">
          <img src="logo.png" alt="" />
          <span>Color Clash</span>
        </button>
        <div class="wallet" aria-label="Player resources">
          <span class="wallet-pill"><span aria-hidden="true">🪙</span><strong id="globalCoins">0</strong></span>
          <span class="wallet-pill"><span aria-hidden="true">💎</span><strong id="globalCrystals">0</strong></span>
          <span class="player-level"><span id="playerLevelLabel">LVL 1</span><i><b id="playerXpBar"></b></i></span>
        </div>
        <button id="settingsButton" class="icon-button" aria-label="Settings">⚙️</button>
      </header>

      <main>
        <section id="homeScreen" class="screen active home-screen" aria-labelledby="heroTitle">
          <div class="hero-card glass">
            <div class="hero-copy">
              <span class="eyebrow" data-i18n="heroEyebrow">A colorful puzzle adventure</span>
              <h1 id="heroTitle"><span data-i18n="heroTitleA">Match.</span> <span class="gradient-text" data-i18n="heroTitleB">Create.</span> <span data-i18n="heroTitleC">Conquer.</span></h1>
              <p data-i18n="heroText">Build spectacular combinations, recover lost artifacts and unlock new worlds.</p>
              <div class="hero-actions">
                <button id="continueButton" class="primary-button"><span data-i18n="continueGame">Continue adventure</span><b>›</b></button>
                <button id="openMapButton" class="secondary-button" data-i18n="levelMap">Level map</button>
              </div>
              <div class="daily-card">
                <span class="daily-icon">🎁</span>
                <div><strong data-i18n="dailyGift">Daily gift</strong><small id="dailyGiftText" data-i18n="dailyGiftReady">Your reward is ready!</small></div>
                <button id="dailyGiftButton" data-i18n="collect">Collect</button>
              </div>
            </div>
            <div class="hero-visual" aria-hidden="true">
              <div class="hero-ring ring-a"></div><div class="hero-ring ring-b"></div>
              <div class="mascot-core"><span>🌈</span><b>COLOR<br />CLASH</b></div>
              <span class="floating-gem gem-a">◆</span><span class="floating-gem gem-b">◆</span><span class="floating-gem gem-c">◆</span>
            </div>
          </div>

          <div class="quick-grid">
            <button class="quick-card glass" data-open="missions"><span class="quick-icon coral">🎯</span><span><strong data-i18n="missions">Missions</strong><small id="missionSummary">0/3</small></span><b>›</b></button>
            <button class="quick-card glass" data-open="achievements"><span class="quick-icon gold">🏆</span><span><strong data-i18n="achievements">Achievements</strong><small id="achievementSummary">0/12</small></span><b>›</b></button>
            <button class="quick-card glass" data-open="shop"><span class="quick-icon violet">🛍️</span><span><strong data-i18n="shop">Power shop</strong><small data-i18n="shopCaption">Boost your game</small></span><b>›</b></button>
            <button class="quick-card glass" data-open="collection"><span class="quick-icon cyan">🗿</span><span><strong data-i18n="collection">Artifacts</strong><small id="artifactSummary">0/3</small></span><b>›</b></button>
          </div>
        </section>

        <section id="mapScreen" class="screen map-screen" aria-labelledby="mapTitle">
          <div class="section-heading">
            <button class="back-button" data-back="home">←</button>
            <div><span class="eyebrow" data-i18n="campaign">Campaign</span><h2 id="mapTitle" data-i18n="chooseLevel">Choose a level</h2></div>
          </div>
          <div id="worldTabs" class="world-tabs" role="tablist"></div>
          <div id="mapPanel" class="map-panel glass"><div id="mapPath" class="map-path"></div></div>
        </section>

        <section id="gameScreen" class="screen game-screen" aria-label="Game board">
          <div class="game-topline">
            <button id="gameBackButton" class="back-button" aria-label="Back to map">←</button>
            <div class="level-heading"><span id="worldName">Candy Coast</span><strong id="levelName">Level 1</strong></div>
            <button id="pauseButton" class="icon-button" aria-label="Pause">Ⅱ</button>
          </div>
          <div class="game-layout">
            <aside class="goal-panel glass">
              <div class="level-badge"><span data-i18n="level">Level</span><strong id="levelNumber">1</strong></div>
              <div class="moves-card"><span data-i18n="moves">Moves</span><strong id="movesLeft">20</strong></div>
              <h3 data-i18n="goals">Goals</h3>
              <div id="goalsList" class="goals-list"></div>
              <div class="score-progress"><span><b data-i18n="score">Score</b><strong id="scoreValue">0</strong></span><i><b id="scoreBar"></b></i></div>
              <div class="combo-display" id="comboDisplay"><span>🔥</span><b id="comboValue">x1</b><small data-i18n="combo">Combo</small></div>
            </aside>
            <div class="board-area">
              <div class="board-frame">
                <div class="board-glow" aria-hidden="true"></div>
                <div id="gameBoard" class="game-board" role="grid" aria-label="Color Clash board"></div>
                <div id="boardMessage" class="board-message" aria-live="polite"></div>
              </div>
              <div id="boosterBar" class="booster-bar glass" aria-label="Boosters"></div>
            </div>
          </div>
        </section>
      </main>
    </div>
    <div id="modalRoot" class="modal-root" aria-live="polite"></div>
    <div id="toastRoot" class="toast-root" aria-live="polite"></div>
    <div id="fxLayer" class="fx-layer" aria-hidden="true"></div>
  </body>
</html>
